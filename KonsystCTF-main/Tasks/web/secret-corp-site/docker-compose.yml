version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8443:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./php:/var/www/html
      - ./static:/var/www/static
    depends_on:
      - php

  php:
    image: php:8.2-fpm-alpine
    volumes:
      - ./php:/var/www/html
      - ./static:/var/www/static