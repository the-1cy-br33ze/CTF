<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Секретный улей</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #FFF8E1;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(233, 185, 73, 0.2);
            text-align: center;
            max-width: 600px;
            border: 3px solid #FFA726;
        }
        h1 {
            color: #4E342E;
            margin-bottom: 30px;
        }
        .flag {
            background: #4E342E;
            color: #FFA726;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 18px;
            margin: 20px 0;
            letter-spacing: 1px;
        }
        .bee {
            width: 100px;
            margin: 20px auto;
            animation: fly 3s infinite;
        }
        @keyframes fly {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.pinimg.com/736x/14/91/c8/1491c82c7081b3b5a432220c451d8dcc.jpg" class="bee" alt="Пчёлка">
        <h1>Добро пожаловать в Секретный Улей!</h1>
        <p>Вы доказали, что достойны наших 25 банок мёда!</p>
        
        <div class="flag" id="flag"></div>
    </div>

    <script>
        if(!localStorage.getItem('honeyAuth')) {
            window.location.href = 'admin.html';
        }
        
        // Генерация "медового" флага
        const flag = "flag{1$L0v3$h0n3y$wHat$Ab0ut$U$?$}";
        document.getElementById('flag').textContent = flag;
    </script>
</body>
</html>
