<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Золотой улей</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #FFA726;
        }
        .login-form h2 {
            color: #4E342E;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group input {
            width: 95%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }
        .btn {
            background: #FFA726;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #F57C00;
        }
        #error {
            color: #d32f2f;
            margin-top: 20px;
            display: none;
        }
        .bee-icon {
            width: 100px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="login-form">
        <img src="https://i.pinimg.com/736x/14/91/c8/1491c82c7081b3b5a432220c451d8dcc.jpg"  class="bee-icon" alt="Пчёлка">
        <h2>Секретная пасека</h2>
        <form id="adminLogin">
            <div class="form-group">
                <input type="text" id="username" value="admin" readonly>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn">Войти в улей</button>
        </form>
        <div id="error">Неверный пароль! Пчёлы не пускают! 🐝</div>
    </div>

    <script>
        document.getElementById('adminLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error');
            
            if (password === "H0-HO-H--HO-H0N3Y!!") {
                localStorage.setItem('honeyAuth', 'true');
                window.location.href = 'admin-panel.html';
            } else {
                errorDiv.style.display = 'block';
                // Задержка для анимации
                setTimeout(() => {
                    errorDiv.style.animation = 'shake 0.5s';
                    setTimeout(() => errorDiv.style.animation = '', 500);
                }, 10);
            }
        });
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</body>
</html>
